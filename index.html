<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عمال التجهيز</title>
<meta name="theme-color" content="#1B0C03">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="splash"><div class="sp-top"><img src="logo-emblem.png" alt="التوحيد إيجيبت"><small>مرحباً بك في</small><h1>ملفات العمال</h1><p>كل عامل في ملف واحد، وترتيب العمال وتقارير الأقسام في إيدك.</p></div><div class="sp-art"></div>
<button id="go" type="button" aria-label="ابدأ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14l6-6 6 6M6 19l6-6 6 6"/></svg>ابدأ</button></div>
<script>
(()=>{
  const splash=document.getElementById('splash'),button=document.getElementById('go');
  if(!splash||!button)return;
  const enter=()=>{
    if(splash.dataset.leaving==='1'||splash.classList.contains('hide'))return;
    splash.dataset.leaving='1';
    splash.classList.add('out');
    window.setTimeout(()=>splash.classList.add('hide'),650);
    try{sessionStorage.setItem('twh_in','1')}catch(_){}
  };
  try{if(sessionStorage.getItem('twh_in'))splash.classList.add('hide')}catch(_){}
  button.addEventListener('click',enter);
  button.addEventListener('pointerup',e=>{if(e.pointerType==='touch'){e.preventDefault();enter()}});
  button.addEventListener('touchend',e=>{e.preventDefault();enter()},{passive:false});
})();
</script>
<header class="top"><div class="logo"><img src="logo-emblem.png" alt=""></div><div><h1 id="title">عمال التجهيز</h1><small id="month"></small></div><button class="gear" data-tab="data" aria-label="البيانات"></button></header>
<main class="wrap">
  <section id="v-list"></section>
  <section id="v-att" class="hide"></section>
  <section id="v-vio" class="hide"></section>
  <section id="v-rank" class="hide"></section>
  <section id="v-rep" class="hide"></section>
  <section id="v-data" class="hide"></section>
</main>
<nav class="nav">
  <button data-tab="list" data-icon="users" class="on"><span>العمال</span></button>
  <button data-tab="att" data-icon="cal"><span>الحضور</span></button>
  <button data-tab="vio" data-icon="flag"><span>المخالفات</span></button>
  <button data-tab="rank" data-icon="trophy"><span>الترتيب</span></button>
  <button data-tab="rep" data-icon="doc"><span>التقارير</span></button>
</nav>
<div id="vioBar" class="hide"><button class="btn ghost2" id="vioClear">إلغاء التحديد</button><button class="btn" id="vioGo"></button></div>
<div class="page" id="page">
  <div class="pbar"><button class="back" id="back" aria-label="رجوع"></button><h2 id="ptitle"></h2><div class="ptools"><button class="paction hide" id="reevalBtn">إعادة تقييم</button><button class="paction danger hide" id="deleteWorkerBtn">حذف</button><button class="back hide" id="editBtn" aria-label="تعديل"></button></div></div>
  <div class="pbody"><div id="shot" style="padding:14px;background:#1B0C03"></div></div>
</div>
<div class="page" id="editor" style="z-index:70"></div>
<button id="fab" aria-label="إضافة عامل" data-act="add">+</button>
<div class="actions hide" id="actions"><div class="inner">
  <button class="act main" id="bSave">حفظ صورة</button>
  <button class="act wa" id="bWa">واتساب</button>
  <button class="act" id="bCopy">نسخ</button>
</div></div>
<input type="file" id="file" accept=".xlsx,.xlsm,.xls,.json" hidden>
<div class="toast" id="toast"></div>
<script src="vendor/xlsx.mini.min.js"></script>
<script src="vendor/html-to-image.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
