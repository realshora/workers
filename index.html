<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ملفات العمال</title>
<meta name="theme-color" content="#1B0C03">
<script>try{var m=localStorage.getItem("twh_theme")||"dark",l=m==="light"||(m==="auto"&&matchMedia("(prefers-color-scheme: light)").matches);document.documentElement.dataset.theme=l?"light":"dark";}catch(e){}</script>
<link rel="preload" as="font" type="font/woff2" crossorigin href="tajawal-arabic-500-normal.woff2?v=8">
<link rel="preload" as="font" type="font/woff2" crossorigin href="tajawal-arabic-700-normal.woff2?v=8">
<link rel="preload" as="font" type="font/woff2" crossorigin href="tajawal-arabic-800-normal.woff2?v=8">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="style.css?v=12">
</head>
<body>
<script>
window.hardRefresh=async function(){try{var rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(function(r){return r.unregister()}));var ks=await caches.keys();await Promise.all(ks.map(function(k){return caches.delete(k)}));}catch(e){}location.reload();};
</script>
<button id="fixbtn" class="hide" onclick="hardRefresh()">التطبيق مش بيفتح؟ دوس هنا للتحديث</button>
<div id="splash"><div class="sp-top"><img src="logo-emblem.png" alt="التوحيد إيجيبت"><small>مرحباً بك في</small><h1>ملفات العمال</h1><p>كل عامل في ملف واحد، وترتيب العمال وتقارير الأقسام في إيدك.</p></div><div class="sp-art"></div>
<button id="go" aria-label="ابدأ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14l6-6 6 6M6 19l6-6 6 6"/></svg>ابدأ</button></div>
<header class="top"><div class="logo"><img src="logo-emblem.png" alt=""></div><div><h1 id="title">عمال التجهيز</h1><small id="month"></small></div><button class="gear" data-tab="data" aria-label="الإعدادات"><span>إعدادات</span></button></header>
<main class="wrap">
  <section id="v-list"></section>
  <section id="v-att" class="hide"></section>
  <section id="v-vio" class="hide"></section>
  <section id="v-rank" class="hide"></section>
  <section id="v-rep" class="hide"></section>
  <section id="v-data" class="hide"></section>
</main>
<nav class="nav">
  <button data-tab="list" data-icon="users" class="on"><span>العمال</span></button>
  <button data-tab="att" data-icon="cal"><span>الحضور</span></button>
  <button data-tab="vio" data-icon="flag"><span>المخالفات</span></button>
  <button data-tab="rank" data-icon="trophy"><span>الترتيب</span></button>
  <button data-tab="rep" data-icon="doc"><span>التقارير</span></button>
</nav>
<div id="vioBar" class="hide"><button class="btn" id="vioGo"></button></div>
<div class="page" id="page">
  <div class="pbar"><button class="back" id="back" aria-label="رجوع"></button><h2 id="ptitle"></h2><button class="back hide" id="zoomBtn" aria-label="تكبير"></button><button class="back hide" id="editBtn" aria-label="تعديل"></button></div>
  <div class="pbody"><div id="shot" style="padding:14px;background:#1B0C03"></div>
  <div id="wbtns" class="wbtns hide"><button class="btn" data-w2="reeval">إعادة تقييم</button><button class="btn ghost2" data-w2="edit">تعديل</button><button class="btn danger" data-w2="del">حذف</button></div></div>
</div>
<div class="page" id="editor" style="z-index:70"></div>
<button id="fab" aria-label="إضافة عامل" data-act="add">+</button>
<div class="actions hide" id="actions"><div class="inner">
  <button class="act main" id="bSave">حفظ صورة</button>
  <button class="act wa" id="bWa">واتساب</button>
  <button class="act" id="bCopy">نسخ</button>
</div></div>
<input type="file" id="file" accept=".xlsx,.xlsm,.xls,.json" hidden>
<div class="toast" id="toast"></div>
<script>
(function(){var sp=document.getElementById('splash'),go=document.getElementById('go');
try{if(localStorage.getItem('twh_seen'))sp.classList.add('hide');}catch(e){}
go.addEventListener('click',function(){sp.classList.add('out');try{localStorage.setItem('twh_seen','1');}catch(e){}setTimeout(function(){sp.classList.add('hide');},650);});
setTimeout(function(){if(!window.__booted)document.getElementById('fixbtn').classList.remove('hide');},3000);})();
</script>
<script src="xlsx.mini.min.js?v=12"></script>
<script src="html-to-image.js?v=12"></script>
<script src="data.js?v=12"></script>
<script src="app.js?v=12"></script>
</body>
</html>
